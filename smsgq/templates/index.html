{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSG4 - Student Management System</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <div class="container">
        <h2>Student Information Form</h2>
    
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Student Name:</label>
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>
            
            <div class="input-group">
                <label>Student ID:</label>
                <input type="text" name="student_id" placeholder="Enter ID" required>
            </div>
            
            <div class="input-group">
                <label>Department:</label>
                <input type="text" name="dept" placeholder="Enter Department (e.g. CSE)" required>
            </div>
            
            <button type="submit">Add Student</button>
        </form>

        <hr>

        <h3>Student List</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Department</th>
                    <th>Actions</th> 
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.student_id }}</td>
                    <td>{{ student.dept }}</td>
                    <td>
                        <a href="{% url 'edit_student' student.id %}" style="padding: 5px 10px; background-color: #ffc107; color: black; text-decoration: none; border-radius: 4px; font-size: 14px; margin-right: 5px; display: inline-block;">Edit</a>
                        
                    
                        <a href="{% url 'delete_student' student.id %}" style="padding: 5px 10px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; display: inline-block;" onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" style="text-align:center;">No student data found!</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
